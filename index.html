<!--Deploy to GitHub pages--><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Facts - Random Facts Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(102, 126, 234, 0.1);
        }

        .fact-box {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-left: 5px solid #667eea;
            padding: 30px;
            margin: 30px 0;
            border-radius: 10px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fact-text {
            font-size: 1.3em;
            color: #333;
            line-height: 1.6;
            font-weight: 500;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(-1px);
        }

        .counter {
            color: #999;
            font-size: 0.9em;
            margin-top: 20px;
            font-style: italic;
        }

        footer {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
            color: #666;
            font-size: 0.95em;
        }

        footer p {
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px;
                border-radius: 15px;
            }

            h1 {
                font-size: 2em;
                margin-bottom: 20px;
            }

            .fact-box {
                padding: 20px;
                margin: 20px 0;
                min-height: 100px;
            }

            .fact-text {
                font-size: 1.1em;
            }

            button {
                padding: 12px 30px;
                font-size: 1em;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.6em;
                margin-bottom: 15px;
            }

            .fact-box {
                padding: 15px;
                margin: 15px 0;
            }

            .fact-text {
                font-size: 1em;
            }

            button {
                padding: 10px 25px;
                font-size: 0.95em;
                width: 100%;
            }

            footer {
                font-size: 0.85em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤓 Fun Facts</h1>
        
        <div class="fact-box">
            <p class="fact-text" id="factDisplay">Click the button to reveal a fun fact!</p>
        </div>

        <button onclick="displayRandomFact()">Get New Fact 🎲</button>
        
        <div class="counter">
            <p>Fact <span id="factNumber">1</span> of 8</p>
        </div>

        <footer>
            <p>Built with GitHub Copilot + Codespaces #MyFirstWebsite</p>
        </footer>
    </div>

    <script>
        const facts = [
            "Lagos is the largest city in Nigeria and one of the fastest-growing cities in Africa, with a population of over 15 million people!",
            "The first programming language was created in 1843 by Ada Lovelace, making her the world's first computer programmer!",
            "Honey never spoils. Archaeologists have found 3,000-year-old honey in Egyptian tombs that is still perfectly edible!",
            "A group of flamingos is called a 'flamboyance' – which perfectly describes their vibrant pink feathers!",
            "Octopuses have three hearts and blue blood due to a copper-based molecule called hemocyanin instead of iron!",
            "The Great Wall of China is not visible from space with the naked eye, despite the common myth!",
            "Bananas are berries, but strawberries are not – they're actually a type of aggregate fruit!",
            "Coding teaches computers to follow logical instructions, and the average programmer writes 40-50 lines of code per day!"
        ];

        let currentFactIndex = -1;
        let usedIndices = [];

        function displayRandomFact() {
            // Reset if all facts have been shown
            if (usedIndices.length === facts.length) {
                usedIndices = [];
            }

            // Get a random fact not yet shown
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * facts.length);
            } while (usedIndices.includes(randomIndex));

            usedIndices.push(randomIndex);
            currentFactIndex = randomIndex;

            // Display the fact with a fade effect
            const factDisplay = document.getElementById('factDisplay');
            factDisplay.style.opacity = '0.7';
            setTimeout(() => {
                factDisplay.textContent = facts[randomIndex];
                factDisplay.style.opacity = '1';
            }, 150);

            // Update counter
            document.getElementById('factNumber').textContent = usedIndices.length;
        }

        // Display first fact on page load
        window.addEventListener('load', displayRandomFact);
    </script>
</body>
</html>
